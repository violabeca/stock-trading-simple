# ===========================================================================
# donchian_breakout — all tunable settings for this strategy (intraday, 1m).
# Blocks: data (what to load), params (single-run defaults), sweep (grid
# exploration), optuna (optimization study + search space).
# ===========================================================================

data:
  universe: HighOctaneTop20  # top-20 HighOctane names by 90d dollar volume (tsim subset)
  bar: 1m                  # intraday; needs an IBKR backfill (see 02_backfill)
  start: "2026-05-01"      # deliberately short (~2 months) while testing the 1m setup
  end: null                # null = everything stored
  session: regular         # channels assume one consistent session
  max_symbols: 20          # the pinned Top20 subset — matches the universe size

params:                    # single-backtest defaults; every key is a signals() argument
  entry_window: 30         # channel lookback (bars = minutes on 1m); breakout = new N-bar extreme
  atr_window: 14           # ATR smoothing window (bars)
  atr_mult: 2.0            # trailing stop distance in ATRs (lower = tighter)
  direction: both          # long | short | both
  skip_open: 15            # no entries in the first N minutes of a session
  skip_close: 15           # no entries in the last N minutes of a session
  eod_exit: true           # default: flat at each session's close. false = hold overnight
                           # (trailing stop / opposite breakout still exit) — both are swept below
  cash_frac: 0.25          # ONE shared $10k wallet (engine cash-shared mode): each entry
                           # deploys 25% of the FREE cash — params-only, not searched

sweep:                     # coarse grid for notebook exploration
  entry_window: [15, 30, 60, 120]
  atr_window: [14]
  atr_mult: [1.5, 2.0, 3.0]
  eod_exit: [true, false]  # flat-at-close vs hold-overnight, side by side

optuna:
  study: donchian-1m-v6    # v6: capital model changed to one shared $10k wallet — v5
                           # scored independent per-symbol books; journal stays on disk
  sampler: nsga2           # nsga2 | tpe | random
  seed: 42
  n_trials: 1000
  min_trades_per_year: 300  # admissibility floor (PER YEAR, not absolute — this
                           # strategy's `end: null` window is short and grows over time):
                           # fewer-trade trials are pruned in-objective
  space:                   # declarative search space -> optimize.suggest_params
    entry_window: { type: int,   low: 10,  high: 1000, log: true }
    atr_window:   { type: int,   low: 7,   high: 100 }
    atr_mult:     { type: float, low: 1.0, high: 10.0, step: 0.25 }
    eod_exit:     { type: categorical, choices: [true, false] }  # hold overnight or go flat at the close
    # direction:    { type: categorical, choices: [long, short, both] }
