# Pre-registered directed links for lead_lag's §6 (leader -> follower).
#
# Written 2026-09-28 BEFORE any lead-lag map was computed on real data, and frozen: the notebook
# stamps this file's sha1 into its SCORECARD. Editing it is a NEW experiment (a new sha1), not a
# correction of the old one.
#
# customer_supplier: the customer leads its supplier (Cohen & Frazzini 2008, "Economic links and
#   predictable returns": customer news reaches the supplier's price late). Curated from memory
#   of 10-K / 20-F / 40-F "major customer" notes (a customer >= 10% of revenue, or named as a
#   largest customer); the shares quoted are approximate and from recent fiscal years, not
#   point-in-time. Only pairs with daily bars for both names in the shared DB are listed.
#   Candidates dropped for having no daily bars: UPS (AMZN), K, KLG, NWL, THS (WMT), SPR, HWM
#   (BA), AXL (GM).
# commodity_producer: cross-asset — the metal ETF leads the miners (the only non-equity daily
#   series in the DB besides SPY). Dropped for no daily bars: GFI, EGO, BTG, MAG.
#
# At 1m/5m most customers have no bars (AAPL, WMT, HD, ... are not in the 1m pool), so the
# links are TESTED at 1d only; the intraday bars report coverage.

