# ===========================================================================
# conviction_flow — informed_flow's alt-data composite, made selective and gated
# on fundamentals. Same insider + rating-change + price-target + short-interest
# ranking and the same TopK-Drop hysteresis selector, plus five open/close levers
# (all OFF by default, so at these params it reproduces informed_flow exactly).
# Layout: data (what panel to load), optuna (study settings), params
# (every knob: doc + shipped value + optional search space and sweep grid).
# ===========================================================================

data:
  universe: LiquidLeaders  # ~100 liquid US names — breadth for cross-sectional ranking
  bar: 1d                  # daily bars (alt-data + fundamentals act over weeks–quarters)
  # Train from 2021 (the 2020 COVID/reflation regime is unlike today's); 2025+ is the
  # notebook's untouched holdout. See the informed_flow README for the DSR/sub-period
  # caveats — they apply here too, with an even larger search space.
  start: "2021-01-01"
  end: "2024-12-31"        # TRAIN cutoff — 2025+ is the notebook's untouched holdout
  session: regular         # daily bars are all regular-session
  max_symbols: 100         # cap at the best-covered names
  # Attached to Panel.features at load time. The first four are the alt-data flow sleeves
  # (as in informed_flow); the five fund_* matrices feed the fundamentals-quality GATE
  # (book-to-price, earnings yield, gross profitability — as in value_factor). A sleeve
  # that is missing or too thin to rank (strategy._MIN_COVERAGE) is dropped and, for the
  # quality gate, the gate self-disables — so an un-ingested table degrades gracefully.
  features: [insider, ratings, price_target, short_interest,
             fund_shares, fund_equity, fund_ni_ttm, fund_gp_ttm, fund_assets]

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  # v1: the initial study for this strategy. NOT comparable to informed_flow's studies —
  # this one searches five extra selectivity levers on top of the same flow composite.
  study: conviction-flow-1d-v3  # v3: 2026-09-14 fundamentals repair — SEC tag fallback per
                           # filing/period, share-count band, monotone per-day pick, 800-day
                           # max age; the quality gate's inputs changed. v2: 2026-07-19 engine
                           # realism (panel-priced costs,
                           # benchmark mask, ffill feature seeding) — v1 journals not comparable
  sampler: nsga2           # nsga2 | tpe | random
  seed: 42
  n_trials: 1000
  min_trades_per_year: 15  # admissibility floor (PER YEAR): daily multi-position portfolio
                           # mode turns over far less than an intraday scanner

# Every parameter declared ONCE: what it means, what ships (`value`), what the
# study may explore (`search`), and what the coarse sweep varies (`grid`).
# No `grid` means the sweep pins it at `value`; a bare scalar means value-only.
params:
  insider_window:
    doc: "trailing bars for insider dollars, normalizer, eligibility (~1 quarter)"
    value: 63
    search: { type: int, low: 21, high: 378, log: true }
  rating_halflife:
    doc: "EMA half-life (bars) for the rating-change stream (~1 month)"
    value: 21
    search: { type: int, low: 5, high: 90, log: true }
  ptrev_halflife:
    doc: "EMA half-life (bars) for the price-target revision stream"
    value: 21
    search: { type: int, low: 5, high: 90, log: true }
  # Composite weights. signals() divides by their SUM, so only the RATIOS matter; w_dtc is
  # the FIXED numeraire (never searched) and the other three float relative to it.
  w_insider:
    doc: "composite weight: insider buying"
    value: 1.0
    # w_dtc is the fixed numeraire (1.0) and is NOT searched; these three float against it.
    search: { type: float, low: 0.0, high: 3.0, step: 0.25 }
    # Fix the sleeve weights and the bands, and toggle the new open-gates on/off to read
    # their marginal effect side by side (16 combos). displace_margin/exit_decay are left at
    # their param defaults here and searched in Optuna.
    grid: [1.0]
  w_rating:
    doc: "composite weight: rating-change momentum"
    value: 1.0
    search: { type: float, low: 0.0, high: 3.0, step: 0.25 }
    grid: [1.0]
  w_ptrev:
    doc: "composite weight: price-target revisions (NOT the target level)"
    value: 0.5
    search: { type: float, low: 0.0, high: 3.0, step: 0.25 }
    grid: [0.5]
  w_dtc:
    doc: "FIXED numeraire \u2014 the scale reference"
    value: 1.0
    grid: [1.0]
  q_in:
    doc: "enter when composite rank is top 20% cross-sectionally"
    value: 0.8
    search: { type: float, low: 0.6, high: 0.95, step: 0.05 }
    grid: [0.8]
  q_out:
    doc: "exit when rank falls below 60% (hysteresis band vs q_in)"
    value: 0.6
    search: { type: float, low: 0.4, high: 0.9, step: 0.05 }
    grid: [0.6]
  max_hold:
    doc: "time-stop backstop (~6 months) for a name parked in the band"
    value: 126
    search: { type: int, low: 21, high: 252, log: true }
  min_events:
    doc: "min insider+rating events in the window to be rankable"
    value: 1
    search: { type: int, low: 1, high: 3 }
  max_positions:
    doc: "slots in the ONE shared book, 1/max_positions each at entry"
    value: 10
    search: { type: int, low: 5, high: 25 }
    grid: [10]
  displace:
    doc: "may a qualifying newcomer evict the weakest holding when full?"
    value: false
    search: { type: categorical, choices: [true, false] }
    grid: [false, true]   # wait-for-vacancy vs evict-the-weakest
  # --- the five selectivity levers, ALL OFF by default (== informed_flow) --------------
  min_quality_pct:
    doc: "fundamentals-quality floor to OPEN (0 = off; needs fund_* data)"
    value: 0.0
    # --- the new selectivity levers (0 / off ends of the ranges reduce to informed_flow) -
    search: { type: float, low: 0.0, high: 0.9, step: 0.1 }   # fundamentals veto
    grid: [0.0, 0.5]   # fundamentals quality gate off vs top-half only
  min_agree:
    doc: "min flow sleeves each ranking the name >= q_in to OPEN (0 = off)"
    value: 0
    search: { type: int, low: 0, high: 3 }   # sleeve agreement
    grid: [0, 2]   # no agreement required vs >= 2 sleeves agree
  min_score:
    doc: "min composite score LEVEL (in [0,1]) to OPEN (0 = off)"
    value: 0.0
    search: { type: float, low: 0.0, high: 0.6, step: 0.05 }   # conviction bar
    grid: [0.0, 0.4]   # conviction bar off vs a modest floor
  displace_margin:
    doc: "rank margin a challenger must beat the weakest holding by (0 = strict)"
    value: 0.0
    search: { type: float, low: 0.0, high: 0.3, step: 0.05 }   # decisive-edge rotation
  exit_decay:
    doc: "sell a holding faded >= this from its peak-while-held (1.0 = off)"
    value: 1.0
    search: { type: float, low: 0.1, high: 1.0, step: 0.1 }   # rank-decay exit (1.0 = off)
