# ===========================================================================
# volume_momentum — all tunable settings for this strategy (intraday, 1m).
# Layout: data (what panel to load), optuna (study settings), params
# (every knob: doc + shipped value + optional search space and sweep grid).
# ===========================================================================

data:
  universe: HighOctaneTop20  # top-20 HighOctane names by 90d dollar volume — aligned with
                             # the other 1m strategies (was the starter WIP leftover)
  bar: 1m                  # intraday; needs an IBKR backfill (see 02_backfill)
  start: "2025-07-01"      # ~10 months of stored 1m history for the train window
  end: "2026-04-30"        # TRAIN cutoff — the ~2-month tail is the notebook's holdout
  session: regular         # profile baseline assumes one consistent session
  max_symbols: 20          # the pinned Top20 subset — matches the universe size

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  study: vm-1m-v3          # v3: 2026-07-19 engine realism (panel-priced costs +
                           # pessimistic stop fills, exit-wins signal conflicts) — v2 journals not comparable.
                           # v2: shared $10k wallet + HighOctaneTop20 + the common train
                           # window — v1 (starter, per-symbol books) stays on disk
  sampler: nsga2           # nsga2 | tpe | random
  seed: 42
  n_trials: 300
  min_trades_per_year: 300  # admissibility floor (PER YEAR, not absolute — a short
                           # window shouldn't need fewer trades to pass): fewer-trade
                           # trials are pruned in-objective (a lucky fill can fake info_ratio)

# Every parameter declared ONCE: what it means, what ships (`value`), what the
# study may explore (`search`), and what the coarse sweep varies (`grid`).
# No `grid` means the sweep pins it at `value`; a bare scalar means value-only.
params:
  fast:
    doc: "fast price-SMA window (bars = minutes on 1m)"
    value: 15
    search: { type: int, low: 5, high: 60 }
    grid: [10, 15, 30]
  slow:
    doc: "slow price-SMA window (bars); must be > fast"
    value: 60
    search: { type: int, low: 30, high: 240 }
    grid: [60, 180]
  threshold:
    doc: "volume must be >= threshold x expected volume"
    value: 4.0
    search: { type: float, low: 2.0, high: 10.0, step: 0.5 }
    grid: [3.0, 4.0, 5.0, 8.0]
  horizon:
    doc: "bars held after entry (minutes on 1m)"
    value: 30
    search: { type: int, low: 5, high: 120, log: true }
    grid: [15, 30, 60]
  baseline:
    doc: "auto | sma | profile (auto: profile intraday, sma on 1d)"
    value: auto
  vol_window:
    doc: "sma-baseline window (bars); only used with baseline: sma"
    value: 20
  profile_days:
    doc: "profile-baseline lookback (sessions)"
    value: 5
    search: { type: int, low: 3, high: 10 }
  smooth_minutes:
    doc: "profile compares to \u00b1N minutes around the same time-of-day"
    value: 2
    search: { type: int, low: 0, high: 5 }
  skip_open:
    doc: "no entries in the first N minutes of a session"
    value: 15
  skip_close:
    doc: "no entries in the last N minutes of a session"
    value: 15
  sl_pct:
    doc: "stop-loss distance (fraction of entry price); 0 disables"
    value: 0.02
    search: { type: float, low: 0.005, high: 0.04, step: 0.005 }
    grid: [0.01, 0.02]
  sl_trail:
    doc: "false = fixed at entry, true = trails the best price"
    value: false
    search: { type: categorical, choices: [true, false] }
  eod_exit:
    doc: "always flat on each session's final bar"
    value: true
  cash_frac:
    doc: >-
      ONE shared $10k wallet (engine cash-shared mode): each entry deploys 25% of the FREE
      cash — params-only, not searched
    value: 0.25
