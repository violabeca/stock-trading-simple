# ===========================================================================
# support_bounce — all tunable settings for this strategy (intraday, 1m).
# Layout: data (what panel to load), optuna (study settings), params
# (every knob: doc + shipped value + optional search space and sweep grid).
# ===========================================================================

data:
  universe: HighOctaneTop20  # top-20 HighOctane names by 90d dollar volume (tsim subset)
  bar: 1m                  # intraday; needs an IBKR backfill (see 02_backfill)
  start: "2025-07-01"      # ~10 months of stored 1m history for the train window
  end: "2026-04-30"        # TRAIN cutoff — the ~2-month tail is the notebook's holdout
  session: regular         # levels assume one consistent session
  max_symbols: 20          # the pinned Top20 subset — matches the universe size

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  study: support_bounce-1m-v4  # v4: 2026-07-19 engine realism (panel-priced costs +
                           # pessimistic stop fills incl. gap-throughs, exit-wins signal conflicts).
                           # v2: capital model changed to one shared wallet — v1 trials
                               # scored 20 independent $10k books (and its journal mixes in
                               # 5 pre-overhaul trials with old-objective values); not
                               # comparable. The v1 journal stays on disk untouched.
  sampler: nsga2           # nsga2 | tpe | random
  seed: 7
  n_trials: 1500
  min_trades_per_year: 300  # admissibility floor (PER YEAR, not absolute — a short
                           # window shouldn't need fewer trades to pass): fewer-trade
                           # trials are pruned in-objective (a lucky fill can fake info_ratio)

# Every parameter declared ONCE: what it means, what ships (`value`), what the
# study may explore (`search`), and what the coarse sweep varies (`grid`).
# No `grid` means the sweep pins it at `value`; a bare scalar means value-only.
params:
  level_window:
    doc: "support lookback in MINUTES (~2 sessions): rolling min of low, shifted"
    value: 780
    search: { type: int, low: 130, high: 1560, log: true }   # ~1/3 .. 4 sessions
  min_touches:
    doc: "distinct prior tests the level needs; 0 = tested-level filter off"
    value: 2
    search: { type: int, low: 0, high: 4 }   # 0 = filter off (ablation)
  touch_tol:
    doc: "touch band in ATRs above the level \u2014 defines \"tests\" AND the dip target"
    value: 0.25
    search: { type: float, low: 0.1, high: 0.75, step: 0.05 }   # valid() needs < entry_dist
  entry_dist:
    doc: "entry zone height in ATRs above the level (smaller = closer = rarer)"
    value: 0.75
    search: { type: float, low: 0.25, high: 2.5, step: 0.25 }
  entry_mode:
    doc: >-
      touch = enter on the dip (limit-order stand-in) | bounce = close must reclaim the band
      first (confirmation against adverse selection)
    value: bounce
    search: { type: categorical, choices: [touch, bounce] }
    grid: [touch, bounce]   # core questions (entry style, trail) x the interval knob
  tf_minutes:
    doc: >-
      trigger candle interval derived from 1m bars: dip = lowest low of the trailing N
      minutes; THE "which interval" knob (must be <= skip_open)
    value: 5
    search: { type: categorical, choices: [1, 5, 15] }   # 1m vs 5m vs 15m trigger
    grid: [1, 5, 15]
  ema_fast:
    doc: "regime fast EMA (minutes)"
    value: 240
    search: { type: int, low: 30, high: 600, log: true }
  ema_slow:
    doc: >-
      regime slow EMA (minutes, ~2.5 sessions); capped ~5 sessions in the space — slower
      regime filters fit the train tape (keltner lesson)
    value: 960
    search: { type: int, low: 120, high: 2000, log: true }   # capped: slow regimes overfit
  regime_dz:
    doc: "dead zone: bull/bear only when the EMAs diverge this fraction; in between = sideways"
    value: 0.002
  allow_sideways:
    doc: "enter in bull + sideways; false = bull only (bear never enters)"
    value: true
    search: { type: categorical, choices: [true, false] }
  atr_window:
    doc: "ATR smoothing (minutes); fixed \u2014 the ATR multipliers are the knobs"
    value: 30
  sl_atr:
    doc: >-
      stop distance in ATRs — deliberately wide, below the level's noise band (valid()
      forces sl_atr > entry_dist + touch_tol); never tight
    value: 3.0
    search: { type: float, low: 1.5, high: 16.0, step: 0.25 }   # floor: tight stops on a reversion entry = fake edge; high widened per v1 boundary check
  sl_trail:
    doc: >-
      true = trail the stop behind the best price (lock in profit) | false = fixed at entry
      — THE user question, swept and searched
    value: false
    search: { type: categorical, choices: [true, false] }   # trail-to-lock vs fixed
    grid: [false, true]
  tp_mult:
    doc: "take-profit in ATRs; 0 = no target (run to time/regime/EOD exits)"
    value: 0.0
    search: { type: float, low: 0.0, high: 16.0, step: 0.5 }   # 0 = no target; high widened per v1 boundary check
  max_hold:
    doc: "time stop (minutes held) when the bounce never comes"
    value: 240
    search: { type: int, low: 30, high: 1560, log: true }   # up to ~4 sessions
  exit_on_bear:
    doc: "regime flip to bear also exits (next bar open)"
    value: true
    search: { type: categorical, choices: [true, false] }
  eod_exit:
    doc: >-
      false = a bounce may ride overnight (the gap carried the edge in the keltner study);
      true = flat on each session's final bar — both searched
    value: false
    search: { type: categorical, choices: [true, false] }   # flat at close vs overnight
  skip_open:
    doc: "no entries in the first N minutes of a session"
    value: 15
  skip_close:
    doc: "no entries in the last N minutes of a session"
    value: 15
  cash_frac:
    doc: >-
      ONE shared $10k wallet (engine cash-shared mode): each entry deploys 25% of the FREE
      cash, so total invested never exceeds the book — params-only, not searched
    value: 0.25
