# ===========================================================================
# baseline — equal-weight buy-and-hold: the benchmark made visible.
# Nothing to optimize; it IS the hurdle (backtest.benchmark) expressed through
# the strategy contract so it can be run and compared per universe. Override
# `universe:` (or the whole data block) to benchmark any panel — the comparison
# notebook (notebooks/04_compare.ipynb) does this per strategy automatically.
# ===========================================================================

data:
  universe: starter        # override to benchmark any universe
  bar: 1d
  start: "2018-01-01"
  end: null                # buy-and-hold has no train/holdout split
  session: regular
  max_symbols: 20

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  study: baseline-v2       # v2: 2026-07-19 engine realism (panel-priced costs +
                           # benchmark late-lister mask). Standard smoke gate (`tsim optimize --strategy
  sampler: nsga2           # baseline --n-trials 1`) runs end to end; the one
  seed: 42                 # trial scores ~0/~0 by construction.
  n_trials: 1

# Every parameter declared ONCE: what it means, what ships (`value`), what the
# study may explore (`search`), and what the coarse sweep varies (`grid`).
# No `grid` means the sweep pins it at `value`; a bare scalar means value-only.
params:
