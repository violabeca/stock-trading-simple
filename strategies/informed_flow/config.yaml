# ===========================================================================
# informed_flow — daily cross-sectional composite of alternative-data signals.
# Since v27 two sleeves carry the ranking: short-interest avoidance (FINRA days-to-cover)
# and analyst rating changes. Insider buying, price-target revisions and recency are
# still built (strategy.py is unchanged) but ship at weight 0.0 — README "Status
# (2026-09-19)" has the measurement that retired them.
# Layout: data (what panel to load), optuna (study settings), params
# (every knob: doc + shipped value + optional search space). Two notebooks drive it:
# informed_flow.ipynb optimizes, informed_flow_diagnostics.ipynb decides what ships.
# The study-version history — and which journals may not be compared — lives in
# README.md under "Study history"; this file describes what runs TODAY.
# ===========================================================================

data:
  universe: Liquid500      # 500 names, POINT-IN-TIME: ranked by median dollar volume over
                           # 2020-01 -> 2020-06 (notebooks/01_universe_screener.ipynb §8b), so
                           # membership is known before optuna.score_from. v30 tried the broader
                           # Liquid1000 (§8c) for breadth and was REJECTED by the rule fixed
                           # before it ran: train alpha rose (+13.1% vs +11.4%) but the honest
                           # walk-forward fell (rule arm +3.2%/yr, P 75%, against +8.4%, P 92%)
                           # and both shuffled-book gates failed (README "Status"). Until v25 this was
                           # LiquidLeaders — 120 names screened on TODAY's liquidity (PLTR, GEV,
                           # SNDK, CRWD, UBER ...): the book ranked among ex-post winners and the
                           # benchmark was an ex-post winners' basket (+40%/yr equal-weight over
                           # the 2025-26 holdout). Residual bias: `securities` holds no delisted
                           # names, so this is still today's listings. Alt-data breadth on it is
                           # 444-500 names per table per year, 2018-2026.
  bar: 1d                  # daily bars (alt-data signals act over weeks–months)
  # Signals load from 2018 so every rolling window (insider_window reaches 378 bars) is warm;
  # nothing before optuna.score_from is SCORED, because the universe did not exist yet.
  start: "2018-01-01"
  end: "2024-12-31"        # TRAIN cutoff — 2025+ is the diagnostics notebook's holdout
  session: regular         # daily bars are all regular-session
  max_symbols: 500         # the whole universe
  # Attached to Panel.features at load time. A sleeve that is missing, or that covers
  # too few names to rank (strategy._MIN_COVERAGE), is dropped and its weight
  # renormalized away — so an un-ingested table degrades gracefully instead of
  # silently becoming a tilt on the handful of names that do have data.
  features: [insider, ratings, price_target, short_interest]

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  # v42: engine proposals #46-#52 (2026-10-24) change portfolio-mode fills
  # (call order, working orders, borrow deferral, NYSE sessions); informed-flow-1d-v41 was the old engine.
  study: informed-flow-1d-v42   # bump this whenever a `search:` bound, the objectives, the
                           # universe, the scored window or the execution model changes: a
                           # journal that mixes two experiments cannot be read. Since v28
                           # (README "Study history" has v3-v28) NOTHING is searched; v29 is the
                           # same strategy under a better instrument, bumped only so its
                           # candidates file and scorecard cannot be mistaken for v28's.
  sampler: random          # nsga2 | tpe | random | grid — moot with an empty space. v35 ran an
                           # EXHAUSTIVE grid over dtc_window (8 points, sampler grid): the main
                           # study and all nine walk-forward re-runs picked 126; v40 then failed
                           # to replicate it on the rolling universe, so 42 is pinned. v41 = that
                           # revert, NOT YET RUN (run both notebooks for its own verdict).
  seed: 42
  n_trials: 1              # like `baseline`: there is nothing to optimize, so the "study" is one
                           # trial that records the shipped rules. v27 searched q_out alone (six
                           # values): its train curve was flat (+8.3% ... +11.6%) and, by the
                           # rule fixed before the run, the ten walk-forward refits had to BEAT
                           # the untuned config to keep the optimizer — they did in 2 of 9 full
                           # periods (stitched alpha +9.2%/yr tuned, +12.3% untuned). The
                           # optimize notebook tops up TO this budget, never past it.
  objectives: [alpha_cagr] # return after the beta the book ran. v26 added `volatility` ↓ as a
                           # second objective and the front became an exposure dial: every row
                           # earned the same 12-18% alpha per unit of beta, and the balanced
                           # pick landed on the vol_target floor — a book half in cash that made
                           # +0.6%/yr on the holdout against buy-and-hold's +18.4%. How much of
                           # the account to invest is a sizing decision, not a search dimension.
                           # max_positions and the overlay are pinned, so alpha alone cannot buy
                           # concentration (v25) or cash (v26). Needs a new `study` name.
  score_from: "2020-07-01" # every trial runs signals from data.start (warm) and is SCORED from
                           # here: the first bar after Liquid500's ranking window, and >= 378
                           # bars after start, so the longest insider_window is warm too.
  min_trades_per_year: 15  # admissibility floor (PER YEAR, not absolute): daily,
                           # multi-position portfolio mode turns over far less than an
                           # intraday scanner — 15/yr ~= 75 trades over this 5y window
  pick_min_trades_per_year: 20   # the PICKING floor, stricter than the pruning one above: a
                           # front row trading less is inadmissible as a pick. ONE value for
                           # both notebooks — the optimizer's pick and every walk-forward
                           # period's re-pick in informed_flow_diagnostics.ipynb — so the
                           # walk-forward always tests the rule that picked the candidate.

# Execution rules the engine applies to this strategy AND its buy-and-hold benchmark.
backtest:
  fill: open               # open | pessimistic.  open: every order at the next bar's
                           # adjusted open — what a market-on-open order in these liquid names
                           # gets.  pessimistic: every buy at that bar's HIGH, every sell at
                           # its LOW. v23-v26 SCORED on pessimistic and it cost ~5%/yr at their
                           # turnover (a zero-skill shuffled book lost 5-7%/yr), more than the
                           # whole signal (~6%/yr gross for the top 30), and taught the search
                           # never to sell (every v26 front row had q_out 0.47-0.51). It is a
                           # stress test, not a yardstick: the diagnostics notebook §3a still
                           # reports it, as a warning row. Flipping this changes every number:
                           # bump optuna.study.
                           # LIVE: every order is market-on-open (the opening auction). The
                           # stored daily open IS the first trade (median 0 bp, p90 4 bp against
                           # 1m data, 21,643 symbol-days); a fill anywhere in the first half
                           # hour lands a median 52 bp away, and the diagnostics' hard gate
                           # keeps train alpha > 0 with every leg 50 bp worse than the open.
  order_notional: 1000     # the real order in dollars = account / max_positions ($30k / 30).
                           # Prices the $1 minimum commission: 10 bp/leg here against the 1 bp
                           # the engine's $10,000 default charges — at 1 bp turnover looks free
                           # and a max-alpha search runs q_out to its ceiling. Re-set it (and
                           # bump the study) if the account or the slot count changes.

# Every parameter declared ONCE: what it means (`doc`), what ships (`value`) and what the
# study may explore (`search`); a bare scalar means value-only. strategies._unpack refuses
# a `value` its own `search` cannot reach. There are no `grid:` lists: informed_flow has no
# coarse sweep — the full study and the diagnostics notebook's walk-forward replaced it.
params:

  # --- signal construction --------------------------------------------------------
  insider_window:
    doc: >-
      Trailing bars for insider dollars, the dollar-volume normalizer and the eligibility
      count (~1 quarter at 63). TRIPLE DUTY, and that confounds a high pick three ways: it
      is the insider lookback, the dollar-volume normalizer's window, AND the eligibility
      window, so a longer value also makes more names rankable — a pick at the ceiling may
      be buying BREADTH, not a longer insider horizon (the literature puts insider drift at
      ~1-6 months, well below 378). Until v21 it had a FOURTH job, the worst one: because
      eligibility is a rolling count over this window, a short value made names churn in
      and out of the universe and turned the count's step-down into the strategy's main
      exit rule (140 of 196 train exits on the v20 pick, which drew insider_window=31).
      The `recency` sleeve now carries staleness with no window of its own, and min_events
      is pinned, so this knob no longer sets the exit rate — but three jobs is still three,
      and a pick here is not a clean statement about the insider horizon.
    value: 126                # PINNED since v27 (was searched 21-378). With w_insider at 0.0 its
                              # only remaining job is the eligibility window: "any insider or
                              # rating event in the last ~6 months" ranks ~473 of 500 names a day.
  rating_halflife:
    doc: EMA half-life (bars) for the rating-change stream (~1 month at 21).
    value: 21                 # PINNED since v27: measured inert. Beta-adjusted 63-bar rank-IC of
                              # the ratings sleeve is +0.024 / +0.025 / +0.022 at half-life
                              # 5 / 21 / 63 — the small effect is a slow drift, not fresh news.
  ptrev_halflife:
    doc: EMA half-life (bars) for the price-target revision stream.
    value: 21                 # pinned: the sleeve ships at weight 0.0

  # --- composite weights ----------------------------------------------------------
  # signals() divides by their SUM, so only the RATIOS matter: (1.0, 1.0, 0.4, 0.5) is the
  # same strategy as (0.4, 0.4, 0.16, 0.2). That made the 4-D weight search really 3-D — a
  # wasted dimension that produced bogus "parameter at boundary" alarms whenever a weight
  # drifted to 1.0. So w_dtc is the FIXED numeraire (never searched) and the rest float
  # against it. Since v24 every searched floor is 0.0: the study may switch a sleeve OFF.
  # Until v23 the floors were 0.25 ("the study sizes a sleeve, the grid decides whether it
  # exists"), but that forced sleeves the search wanted gone into every pick: v23's insider
  # sleeve had a NEGATIVE train rank-IC (−0.015 at 63d) and w_ptrev sat on its 0.25 floor for
  # 64% of the front, so the shipped composite carried both by construction. w_dtc is the
  # fixed 1.0 numeraire, so the weights can never all be zero.
  #
  # SINCE v27 NO WEIGHT IS SEARCHED. Six v26 walk-forward refits chose w_insider 0.25-2.75,
  # w_rating 0.25-2.25, w_recency 0.5-3.75 — no agreement on anything — and the v26 pick put
  # 56% of the composite on insider + recency. Which sleeves exist is now decided by a rule
  # fixed BEFORE it was read, on train years only (2020-07 -> 2024-12): beta-adjusted 63-bar
  # rank-IC with t >= 2, positive in >= 4 of 5 calendar years and in >= 2 of 3 dollar-volume
  # terciles. short_interest passes (+0.048, t 4.7, 5/5, 3/3), ratings narrowly (+0.025,
  # t 2.2, 4/5, 3/3); insider (+0.011, t 0.4), price_target (+0.005) and recency (-0.012)
  # fail. The two survivors at equal weight score +0.048 (t 6.0, every year 0.042-0.054).
  # The diagnostics notebook re-reads the rule every run (§2a) and §4b votes on ratings
  # out of sample. Survivors ship at 1.0, the rest at 0.0.
  # SINCE v32 THE BAR IS t >= 3 (IDEAS.md, pre-registered): five sleeves re-tested every six
  # months at t >= 2 let a noise sleeve in on ~40% of readings, and ratings (t 2.2 on train,
  # t -3.0 on the holdout) is what that looks like. At t >= 3 only short_interest ships.
  w_insider:
    doc: >-
      Composite weight on insider buying. 0.0 switches the sleeve off — shipped OFF since v27:
      the net-dollar measure is 96% sells, and screened buys-only versions score zero in this
      large-cap universe too (README "Status (2026-09-19)").
    value: 0.0
  w_rating:
    doc: Composite weight on rating-change momentum. 0.0 switches it off.
    value: 0.0                # OFF since v32 (t 2.2 < 3). v27-v31 shipped it at 1.0; the
                              # walk-forward's "ratings back in" flip measures what it adds.
  w_ptrev:
    doc: >-
      Composite weight on price-target REVISIONS (never the target-to-price level — Han-Kang
      2022 show price drifts against the level, worst in exactly this large-cap universe).
      Shipped OFF since v27: a revision moves the stock +0.8% / -1.0% on its own day and
      nothing from the next open on, so a daily strategy has nothing to collect.
    value: 0.0
  w_dtc:
    doc: >-
      Composite weight on (negated) days-to-cover — low short interest is the favourable
      tilt. The FIXED numeraire at 1.0: never searched, because only weight ratios matter
      and searching all four would waste a dimension.
    value: 1.0
  w_recency:
    doc: >-
      Composite weight on RECENCY of coverage — bars since this name's last insider or
      rating event, negated so fresher ranks higher. Not a fifth data source but a decay on
      the other four: each of them reads its signal through a trailing window or an EMA, so
      inside that window an event's AGE is invisible and a three-day-old insider buy scores
      like a three-month-old one. That information used to leak in through `min_events`
      instead — a rolling count steps down when an old filing ages out of insider_window,
      which dropped the name from the universe and force-sold it — making the SEC/Yahoo
      filing calendar the de-facto exit rule (140 of 196 train exits, 19 of 29 holdout
      exits, at a median score_pct of 0.94, 92% still above q_in when sold; AMZN's 2-bar
      holdout position was two such steps 31 bars apart, four legs of costs, neither
      composite moving). An event study over those forced exits says the information is
      real but small — the replacement beat the sold name by +1.04% at 5 bars (p=0.052) and
      +1.57% at 10 (p=0.030), gone by 63 — which is an argument for a sized, ablatable
      sleeve and against a cliff. This sleeve has NO window of its own, so it also
      decouples staleness from insider_window's other three jobs. 0.0 switches it off; the
      diagnostics notebook (§4b) re-scores every walk-forward pick with it off and at 1.0,
      the out-of-sample test of whether it earns its weight. Shipped OFF since v27: the sleeve
      is direction-blind (a fresh downgrade ranks as high as a fresh upgrade) and its
      beta-adjusted rank-IC is +0.004 / +0.002 / 0.000 / -0.012 at 5 / 10 / 21 / 63 bars.
    value: 0.0

  # --- price-derived market-condition sleeves --------------------------------------
  # These read panel.close directly — no alt-data table — so they always cover the universe:
  # a name drifting sideways or down earns a low tech-rank that drags its composite down and
  # pushes it out of the limited slots. Ranked only WITHIN the alt-data-eligible
  # cross-section, so they confirm an already-rankable name and can never pull in a name the
  # model has no evidence on. Currently OFF (value 0.0) and NOT searched — v13-vs-v14's
  # controlled holdout ablation put their effect at ~zero (holdout IR 2.02 -> 2.02). Re-add a
  # `search:` here to let the study size them.
  w_trend:
    doc: Composite weight on the MA-trend sleeve, SMA(trend_fast)/SMA(trend_slow) - 1.
    value: 0.0
  w_rsi:
    doc: Composite weight on the Wilder-RSI(rsi_period) sleeve.
    value: 0.0
  trend_fast:
    doc: >-
      MA-trend fast leg (bars, ~1mo). The crossover reads the trend's slope, which is
      smoother than a single-MA distance; valid() enforces trend_fast < trend_slow.
    value: 21
  trend_slow:
    doc: MA-trend slow leg (bars, ~6mo) — matches the ~1-6mo alt-data drift horizon.
    value: 126
  rsi_period:
    doc: Wilder-RSI lookback (bars) — the canonical 14.
    value: 14

  # --- liquidity neutrality -----------------------------------------------------------
  neutral_groups:
    doc: >-
      Rank every sleeve INSIDE this many dollar-volume groups (trailing 63-bar median of
      close x volume) instead of across the whole universe; 0 = off. Days-to-cover has volume
      in its denominator, so the plain short-interest ranking leans toward heavily traded names
      (rank correlation ~0.4 with dollar volume) — a liquidity bet the thesis never asked for,
      and one that flattered 2025-26, when a naive basket of the 50 most traded names beat the
      book. On train the signal is positive inside every dollar-volume group, so it should not
      need the lean. Whether it SHIPS is decided on train only (IDEAS.md, v31).
    value: 5                  # ON since v31, by the train-only rule fixed before the test: with 5
                              # groups the composite still passes the signal rule (beta-adjusted
                              # IC +0.044, t 5.7, 5/5 years, 3/3 groups; plain +0.048, t 6.0), its
                              # top 30 keep 96% of their forward return (+1.54% vs +1.61% a
                              # quarter), and the score's rank correlation with dollar volume
                              # falls from 0.27 to 0.02. It costs 1.3 points of train alpha
                              # (+10.1% vs +11.4%): that was the lean's own contribution.

  dtc_window:
    doc: >-
      Trailing bars the short-interest sleeve AVERAGES days-to-cover over before ranking (1 = the
      latest settlement alone). Days-to-cover = FINRA short interest / FINRA average daily volume,
      and the noisy volume denominator makes one settlement's rank jitter: 86-95% of exits happened
      on the bar a new settlement arrived, with a median hold of 26 bars. Averaging the carried level
      over ~2 months (~4 settlements) measures the same short position with less noise, and only where
      the level itself is live (a masked, stale value is never revived).
    value: 42                 # REVERTED by v40 (pre-registered rule, 2026-09-24): v35's exhaustive grid
                              # picked 126 on the fixed Liquid500 (train +13.2%, at the grid EDGE; out of
                              # sample +2.2 pts, P 83%); replicated on the ROLLING point-in-time universe
                              # it did not hold: fixed rules -0.1 pt (P 0.4965 < 0.50), 2025+ -2.4, the
                              # procedure -3.2 (P 16%). It won only where it had been chosen (train +3.9).
                              # v34 shipped 42, pre-registered from TRAIN: beta-adjusted IC
                              # at 1 / 21 / 42 / 63 bars +0.046 / +0.050 / +0.055 / +0.058 (5/5 years
                              # each), top-30 forward return +1.23 -> +1.53%/quarter, top-decile daily
                              # churn 0.125 -> 0.068. 42 = ~4 settlements, the a-priori pick, not the
                              # train maximum.

  # --- the entry/exit band ---------------------------------------------------------
  # v13 and v14 both converged on 0.75/0.45, and v26's whole front sat at q_out 0.47-0.51 —
  # but those studies paid pessimistic fills (~1% per leg), which makes "never sell" optimal
  # whatever the signal says. Measured directly on train, only the TOP FIFTH of the
  # two-sleeve ranking pays (+1.3%/quarter vs the average name, t 6.3; the fourth fifth
  # -0.2%, the middle 0.0%), so a holding that has slid to rank 0.5 is dead weight. The
  # band now sits where the information is.
  q_in:
    doc: Buy when the composite rank reaches this quantile (0.90 = top 10%). Qualifying is
         necessary, not sufficient — it still needs a free slot.
    value: 0.90               # PINNED since v27: measured inert (slots fill best-ranked-first
                              # and ~100 names qualify for 30 slots, so entries come from the
                              # very top whatever this says); it only stops a thin day from
                              # buying mediocre names.
  q_out:
    doc: >-
      Sell when the rank falls below this. The gap to q_in is the hysteresis band that damps
      turnover. Measured caveat: at a LOW displace_margin the band is nearly dormant — the
      queue of waiting names evicts a holding long before its rank decays this far (4 of 368
      exits on the v15 pick; 5 of 127 on the v16 pick), so this knob only really bites as
      the margin approaches 1.0. It trades the freshness of what is held against turnover:
      at 0.80 with 30 slots (train, selection rules only) the book turns over ~3.6x/yr, median
      hold ~52 bars, mean held rank 0.94.
    value: 0.80               # PINNED since v28. v27 searched it (0.60-0.85): flat on train, and
                              # the refits' picks lost to this fixed value out of sample. The
                              # diagnostics notebook's §3d still shows its neighbourhood, and the
                              # walk-forward keeps a "sell at rank 0.47" arm (the v26 habit).
  max_hold:
    doc: >-
      Time-stop backstop in bars (~6 months). It exists for ONE case: a name parked in the
      hysteresis band — too weak to re-qualify, not weak enough to trip q_out — quietly
      aging while the evidence that bought it decays out of the trailing windows. It cannot
      evict a name currently ranked >= q_in; that name has a fresh thesis and its clock
      restarts. Same caveat as q_out: at a low displace_margin the clock never runs out
      (measured max 3 bars parked, against the 65 it needed) — it fired ZERO times across
      the whole v16 holdout book.
    value: 126                # PINNED since v27: inert in every study that searched it, and with
                              # a high q_out it binds even less (0% of exits at q_out >= 0.80).
  min_events:
    doc: >-
      Minimum trailing event DAYS for a name to be RANKABLE at all (an ineligible name is
      dropped from the cross-section, not merely blocked from entering). A universe floor
      and nothing else: "has the model seen anything about this name?". PINNED at 1 and NO
      LONGER SEARCHED, which is the v21 change. It used to search [1, 3], and that made it
      the strategy's dominant exit rule rather than a filter: the count is a rolling sum
      over insider_window, so it steps DOWN when an old filing ages out, on a bar where
      nothing happened to the name. The v20 pick drew 3 and paid for it — 140 of 196 train
      exits and 19 of 29 holdout exits were eligibility losses, 95% of them a single event
      ageing out (3 -> 2), at a median score_pct of 0.94, with 92% of the sold names still
      ABOVE q_in. The three documented brakes (q_in/q_out, max_hold, displace_margin)
      governed under a third of exits between them. Staleness is now expressed by
      w_recency, continuously and inside the ranking, so a stale name drifts down and
      leaves through q_out on an ordering. Since v37, 0 means something else: eligible wherever
      a RANKED sleeve has a live value (the sleeve's own evidence), never "every name".
    value: 1                  # v37 tried 0 (eligible wherever the ranked sleeve has live data) and it
                              # was REJECTED: fixed-rules walk-forward -1.1 pts (P 31%), 2025+ -1.8,
                              # train -4.8. The names the gate keeps out are mostly interlisted and
                              # ADRs (SU, CP, TD, ENB, NVO ...) whose FINRA short interest covers only
                              # the US line, so their days-to-cover reads falsely LOW and they rank top.

  # --- the book (capital constraint) ------------------------------------------------
  max_positions:
    doc: >-
      Slots in the book. ONE shared cash account (engine portfolio mode) split into
      max_positions slots of 1/max_positions each AT ENTRY, then left to drift — so a new
      name can only be bought by selling an existing one, and when fewer names qualify the
      rest stays in cash. This replaced per-symbol cash accounts, under which the strategy
      sat ~30% invested against a 100%-invested benchmark and diluted the edge across four
      times as many names as it could survive (top decile +5.8%/yr active, top 40%
      +0.6%/yr). THE knob the signal cares about most, and a risk decision rather than a
      free parameter: fewer slots is a purer signal but a lumpier, more fragile book. Every
      study so far has pinned it at whatever the low bound was (30 -> 15 -> 8 -> 5), so
      treat a pick at the floor as a statement about concentration, not a converged value.
      PINNED at 15 since v26 as a RISK POLICY, like retrim_k: the study answered "fewer" at
      every floor it was given, so searching it never converged. The diagnostics notebook's
      concentration curve (§3f) records what the other widths would have done. 30 since v27
      (was 15): still the top 6% of ~470 ranked names, and on train the daily top 30 of the
      two-sleeve ranking earned the same per name as the top 15 (+1.6%/quarter, t 4.3 vs 3.4)
      with roughly half the name-specific luck — which is what makes a verdict possible at all.
      backtest.order_notional is account / this; change them together.
    value: 30                 # v38 tried 20 and it was REJECTED: fixed-rules walk-forward +0.7 pts
                              # (P 59%), 2025+ -2.7, leave-top-5-out +2.9 -> +0.9 (the gain was a few
                              # winners: AMD, NVDA, OKLO, SNDK ...), 18 completed holds/yr (gate 20).
                              # WHOLE SHARES are fine at this width (measured 2026-09-23): at $30k
                              # or $50k, 30 or 20 slots, rounding every order down to whole shares
                              # moved alpha by -0.2 ... +0.4 points a year (idle cash ~2% -> ~4%;
                              # 11 of 498 names cost more than a $1,000 slot and are skipped). The
                              # diagnostics gate it (whole shares at ACCOUNT); fractional is not
                              # required.
  displace_margin:
    doc: >-
      What happens when a qualifying name arrives and every slot is full, on ONE continuous
      axis: the challenger evicts the weakest holding only if it out-ranks it by this much,
      in composite-rank units (one rank place in a ~450-name cross-section is ~0.002, so
      0.05 is "about twenty places clear"). 0.0 = evict on any epsilon, chasing the top of
      the ranking and paying for it in costs. 1.0 = unreachable, since score_pct is a
      percentile in (0, 1], so nothing is ever displaced and a challenger waits for a
      vacancy. THIS IS THE ONLY BRAKE ON DISPLACEMENT: q_in/q_out and max_hold gate a
      name's rank LEVEL, while displacement is an ORDERING comparison none of them can see
      — on the v16 pick's holdout book 122 of 127 exits were displacements, median winning
      margin ~2 rank places, 16% of them a single place, and because score_pct is a
      percentile a name can lose its slot on a bar where its own composite did not move at
      all (MRVL, 2025-12-15, re-bought 7 bars later). An event study over all 121 of those
      evictions put the challenger's forward return minus the evicted name's at zero to
      every horizon (win rate ~50%, p >= 0.67): the swaps paid two legs of costs for no
      information. There used to be a separate `displace:` boolean in front of this, which
      v18 proved was the same axis wearing two hats — displace=false gives a BIT-IDENTICAL
      held mask to margin >= 1.0. Keeping both cost real damage: every displace=false trial
      carried a margin that did nothing, so 33 of v18's 55 Pareto-front trials were one
      strategy recorded under 14 different margins, all scoring identically to the last
      digit. And the flag reached past this knob's own ceiling — the objective was still
      improving at the old 0.15 bound, so "brake harder" could only be said by flipping a
      categorical that jumped to infinity, leaving 0.15-to-1.0 unexplorable. High bound is
      1.0 for that reason, and it is a REACHED bound by construction, not a clipped one.
    value: 1.0                 # == the old shipped `displace: false`, bit-for-bit. PINNED since
                               # v27 (was searched 0.0-1.0): inert at every pick since v19.
  retrim_k:
    doc: >-
      Single-name concentration cap (engine _retrim_loop). A held slot drifts untouched
      UNTIL its book weight reaches retrim_k x its 1/max_positions target (2.0 = it
      doubled), then it is trimmed back to the slot and the freed cash rotates into the next
      pick. Risk control, not signal: it exists so one lucky pop cannot dominate the book
      and crown a parameter set. Deliberately a FIXED policy with no `search:` — optimizing
      it would just tune the cap to whatever flattered the in-sample winner. null disables.
    value: 2.0

  # --- the risk overlay: how much of the book is invested at all ---------------------
  # One exposure number per bar scales every target weight; the rest sits in cash
  # (strategy._exposure). PINNED OFF since v27, nothing here is searched. v26 searched it under
  # a `volatility` objective and paid for it out of sample: five of six walk-forward refits
  # chose vol_target at its 0.10-0.13 floor, and in every one of those periods the same pick
  # with the overlay off did better (mean OOS alpha -0.8%/yr against -6.4%). On the holdout it
  # cut the book to ~25% invested in April 2025, at the low, and was still at 40% in May.
  # The code stays: set risk_method by hand to size a live book more cautiously.
  risk_method:
    doc: >-
      none: always fully invested. cash_switch: a trend filter on the panel's equal-weight
      index — keep only risk_off_exposure invested while the index closes more than
      regime_band below its regime_window-bar average, back to fully invested once it closes
      regime_band above it. vol_target: exposure = min(1, target_vol / the unscaled book's
      realized volatility over vol_window bars), moved in exposure_step increments. Both are
      decided at bar t's close and traded at t+1's open.
    value: "none"
  risk_off_exposure:
    doc: >-
      cash_switch only — share of the book kept invested in a downtrend (0.0 = all cash,
      0.5 = half). The search stops at 0.8, because 1.0 is exactly risk_method none.
    value: 0.0
  regime_window:
    doc: >-
      cash_switch only — moving-average length of the index in bars (~10 months). PINNED at
      the textbook 200 (Faber 2007), not searched: the window is the knob a trend filter is
      easiest to curve-fit on. Add a `search:` to let the study move it.
    value: 200
  regime_band:
    doc: >-
      cash_switch only — hysteresis around the average. At 0.02 the index must close 2%
      below it to go to cash and 2% above it to come back; without the band a sideways market
      flips the whole book (two legs of costs on every slot) every few days. Pinned.
    value: 0.02
  target_vol:
    doc: >-
      vol_target only — the annual risk rate to aim for. Buy-and-hold of LiquidLeaders ran
      ~21% (2018-2024) and the unscaled v23 book ~23%, so 0.30 rarely binds and 0.10 keeps
      the book roughly half in cash.
    value: 0.20
  vol_window:
    doc: >-
      vol_target only — trailing bars of realized volatility (~1 month): short enough to
      react within weeks of turbulence starting. Pinned.
    value: 21
  exposure_step:
    doc: >-
      vol_target only — the exposure moves only once its target has drifted this far (0.10 =
      ten percentage points). Every change re-trims every held name, so an un-banded overlay
      would trade the whole book daily. Pinned.
    value: 0.10
