# TEMPLATE strategy config — blocks: data, optuna, backtest (optional), params.

data:                      # which panel the notebook / optimizer loads
  universe: starter        # a name from settings.yaml or universes.yaml
  bar: 1d                  # 1d | 1m — the STORED bar
  resample: null           # minutes (5, 15, ...) to derive coarser candles from a 1m load;
                           # never backfilled (data.resample_panel). Bump `study` on a change
  start: "2018-01-01"
  end: null                # set to the TRAIN cutoff; the notebook's out-of-sample
                           # section loads end=null and replays the tail as the
                           # untouched holdout (null = everything stored)
  session: regular         # regular | extended | both (rth filter; matters intraday)
  max_symbols: 20          # cap at the best-covered names

# Study settings. The search SPACE is not here — each parameter declares its own
# `search:` next to the value it ships, so the two cannot disagree.
optuna:
  study: template-v1       # journal file: studies/<study>.log (rename = fresh study).
                           # BUMP IT whenever a `search:` bound, the objective or the
                           # execution model changes: a journal that mixes two spaces
                           # cannot be read, and nothing detects that for you.
  sampler: nsga2           # nsga2 | tpe | random
  seed: 42
  n_trials: 100
  # objectives: [excess_cagr, volatility]  # the default; one or two of optimize.SCOREABLE
                           # (excess_cagr, alpha_cagr, info_ratio, volatility,
                           # tracking_error, max_drawdown) — directions are built in. One
                           # name = a single-objective study whose "front" is its best trial.
                           # Changing this needs a new `study` name. alpha_cagr is for a
                           # near-zero-beta book only (see optimize.OBJECTIVES).
  # score_from: "2018-03-01"  # score every trial WARM from this date (signals on the whole
                           # panel) — skips an indicator warm-up. Stamped into the journal.
  # min_trades_per_year: 300  # admissibility floor, PER YEAR not absolute (an
                           # absolute count is implicitly stricter on a short window
                           # than a long one for the same trading style): trials
                           # trading below this rate are pruned in-objective
                           # (300 fits intraday; ~25 for a daily portfolio-mode strategy)

# Execution rules the engine applies to this strategy AND its benchmark (optional block).
backtest:
  fill: open               # open: every order at the next bar's adjusted open (default).
                           # pessimistic: every buy at that bar's high, every sell at its
                           # low — a worst-case execution stress. Bump optuna.study on a flip.

# EVERY PARAMETER IS DECLARED ONCE, here — there is no separate sweep or space block:
#
#   doc:    what the knob means, and anything a future reader would otherwise re-derive
#   value:  what SHIPS. The single source of truth: `bt.evaluate` starts from it, and
#           every knob the sweep grid omits falls back to it
#   search: the optuna range (omit -> the study never touches this knob)
#   grid:   the coarse-sweep values (omit -> the sweep PINS it at `value`)
#
# A bare scalar (`cash_frac: 0.25`) is shorthand for value-only. Two invariants are
# enforced when the config loads, because both failures are silent: `value` must be
# reachable by its own `search`, and `value` must appear in its own `grid` — otherwise the
# sweep, and every walk-forward that re-picks from it, validates a strategy nobody runs.
params:
  example_window:
    doc: Lookback in bars for the example signal.
    value: 20
    search: { type: int, low: 5, high: 100 }
    grid: [10, 20, 50]     # contains `value` — the load-time invariant checks that
  cash_frac:
    doc: >-
      ONE shared $10k wallet (engine cash-shared mode): each entry deploys this fraction of
      the FREE cash, so total invested can never exceed the wallet. Params-only, not
      searched — the repo default for a multi-symbol signal strategy.
    value: 0.25
