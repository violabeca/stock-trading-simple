# ===========================================================================
# keltner_reversion — all tunable settings for this strategy (intraday, 1m).
# Blocks: data (what to load), params (single-run defaults), sweep (grid
# exploration), optuna (optimization study + search space).
# ===========================================================================

data:
  universe: HighOctaneTop20  # top-20 HighOctane names by 90d dollar volume (tsim subset)
  bar: 1m                  # intraday; needs an IBKR backfill (see 02_backfill)
  start: "2025-07-01"      # ~10 months of stored 1m history for the train window
  end: "2026-04-30"        # TRAIN cutoff — the ~2-month tail is the notebook's holdout
  session: regular         # bands assume one consistent session
  max_symbols: 40          # cap at the best-covered names

params:                    # single-backtest defaults; every key is a signals() argument
  trend_window: 960        # regime SMA (bars = minutes on 1m); ~2.5 sessions
  band_window: 120         # midline SMA (bars); the reversion target and exit level
  atr_window: 30           # ATR smoothing window (bars); sets the band scale
  band_mult: 6.0           # entry stretch in ATRs below/above the midline (THE knob)
                           # shallow stretches churn to death on costs at 1m — go deep
  horizon: 240             # time stop (bars held) when the reversion never comes
  direction: long          # long | short | both (short fades rallies in downtrends)
  sl_mult: 0.0             # stop-loss distance in ATRs at entry; 0 disables
  skip_open: 15            # no entries in the first N minutes of a session
  skip_close: 15           # no entries in the last N minutes of a session
  eod_exit: false          # false = deep dips may be held overnight (the gap-back pays);
                           # true = strictly intraday — both are optimized below

sweep:                     # coarse grid (24 combos; valid() reads band+trend, keep both here)
  trend_window: [480, 960]
  band_window: [60, 120]
  band_mult: [5.0, 7.0, 9.0]
  horizon: [120, 360]

optuna:
  study: keltner-1m-v2     # fresh confirmation study (v1 = exploratory; new seed, final space)
  sampler: nsga2           # nsga2 | tpe | random
  seed: 7
  n_trials: 1000
  space:                   # declarative search space -> optimize.suggest_params
    trend_window: { type: int,   low: 60,   high: 2000, log: true }  # 1h .. ~5 sessions; longer
                           # filters stop being an intraday regime and fit the train tape (v1 finding)
    band_window:  { type: int,   low: 5,    high: 390,  log: true }
    atr_window:   { type: int,   low: 5,    high: 120,  log: true }
    band_mult:    { type: float, low: 0.25, high: 12.0, step: 0.25 }
    horizon:      { type: int,   low: 5,    high: 1200, log: true }  # up to ~3 sessions (multi-day holds with eod_exit: false)
    sl_mult:      { type: float, low: 0.0,  high: 6.0,  step: 0.5 }  # 0 = stop off, searchable
    # (a boundary "widen low" flag on sl_mult just means the front prefers no stop — 0 is the floor)
    direction:    { type: categorical, choices: [long, both] }       # fade dips only, or rips too
    eod_exit:     { type: categorical, choices: [true, false] }      # flat at close vs hold overnight
