# ===========================================================================
# Global settings for trading-simple. Every key maps 1:1 onto the pydantic
# models in src/trading_simple/config.py. Environment variables override this
# file: TRADING_<SECTION>__<KEY>, e.g. TRADING_IBKR__PORT=4001.
# Strategy-specific knobs do NOT live here — see strategies/<name>/config.yaml.
# ===========================================================================

# The SHARED TimescaleDB (also used by the sibling stock-trading repo).
# This repo connects to it; it never creates or migrates it.
db:
  host: localhost
  port: 5432
  user: trading
  password: trading
  name: trading

# Interactive Brokers Gateway (1-minute history). 4002 = IB Gateway paper;
# live GW = 4001, TWS paper = 7497, TWS live = 7496.
# extended_hours: false -> backfills store regular-session bars only.
# Set true (or pass --extended-hours to `tsim backfill`) to also store
# pre/post-market bars; they are tagged rth=false either way.
ibkr:
  host: 127.0.0.1
  port: 4002
  client_id: 1
  max_requests_per_10min: 80   # IBKR's documented cap is ~60/10min; a 65-request live
                                # test on 2026-09-29 hit no pacing violation, but 80 is
                                # untested and above even that -- watch for Error 420/162
                                # "pacing violation" messages if the sweep starts erroring
  pace_seconds: 0.5
  extended_hours: false

# Trading friction charged by every backtest (converted to vectorbt fees/slippage).
costs:
  commission_per_share: 0.005
  min_commission: 1.00
  spread_bps: 2.0
  slippage_bps: 1.0

# Backtest engine defaults shared by all strategies.
backtest:
  init_cash: 10000
  chunk_size: 12       # parameter combos stacked per vectorbt call (memory bound)
  engine: auto         # auto | rust | numba  -> vbt.settings['engine']

# Per-symbol venue overrides for non-US listings, e.g.
#   NESN: SIX
# Common Swiss blue chips are already built in (see exchanges.py).
exchanges: {}

# Hand-edited universes. The screener notebook writes bigger ones to
# config/universes.yaml, which is merged in on top of this map.
universe:
  starter: [AAPL, MSFT, NVDA, JPM, XOM, GLD, SLV, SPY]
  # Morning200's ten most liquid names by its own point-in-time ranking: median daily dollar
  # volume over 2025-01..06, a window that closes before the 1m backtest opens (2025-07-01;
  # notebooks/01_universe_screener.ipynb §8). Stored here in rank order (trend_following_1m).
  Morning10: [HOOD, MU, COIN, SMCI, INTC, ORCL, GS, NOW, MRVL, SPOT]
  # The direction study's five names (strategies/burst_scan/DIRECTION_REPORT.md): liquid, with 1m
  # bars from 2025-06-18 and free options data (burst_scan/options_free_data.ipynb). darts_forecast.
  DirectionFive: [MU, COIN, CSCO, AAL, ANET]
